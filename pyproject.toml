[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "honeyforge"
version = "0.1.0"
description = "Honeypot control plane, durable sensor agent and deterministic investigation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "argon2-cffi>=23,<26",
  "docker>=7.1,<8",
  "psutil>=6,<8",
  "cryptography==50.0.2",
  "maxminddb==3.2.0",
  "paramiko>=3.5,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "paramiko>=3.5,<5",
    "stix2==3.0.2",
]

[project.scripts]
hf-api = "honeyforge.api.main:run"
hf-agent = "honeyforge.agent.main:run"
asset-sync = "honeyforge.agent.main:run"
hf-admin = "honeyforge.infrastructure.bootstrap:run"
hf-geo-update = "honeyforge.infrastructure.geo_update:run"
hf-siem-pull = "honeyforge.infrastructure.siem_receiver:run"

[tool.hatch.build.targets.wheel]
packages = ["src/honeyforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
