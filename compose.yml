services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: honeyforge
      POSTGRES_DB: honeyforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.sh first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeyforge -d honeyforge"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
